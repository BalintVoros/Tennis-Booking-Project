{% extends "base.html" %}

{% block title %}Foglalási Naptár - Tenisz Foglaló{% endblock %}

{% block content %}
<h2>Foglalási Naptár</h2>


<div id='calendar'></div>


<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/hu.global.min.js'></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var calendarEl = document.getElementById('calendar');
  var calendar = new FullCalendar.Calendar(calendarEl, {

    initialView: 'timeGridWeek', 
    // ========================
    locale: 'hu',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',

      right: 'timeGridDay,timeGridWeek,dayGridMonth' 
      // ==============================================================
    },
    timeZone: 'Europe/Budapest',
    firstDay: 1,
    businessHours: {
       daysOfWeek: [ 1, 2, 3, 4, 5, 6, 7 ],
       startTime: '08:00',
       endTime: '22:00',
    },
    nowIndicator: true,
    slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
    eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
    slotDuration: '00:30:00',


    // ===============================================
    events: '/api/bookings', 

    // --- Interakciók ---
    eventClick: function(info) {
       window.location.href = '/booking/' + info.event.id;
       info.jsEvent.preventDefault();
     }

  });
  calendar.render();
});
</script>


<style>
    #calendar {
        max-width: 1100px;
        margin: 20px auto;
    }
</style>
{% endblock %}
