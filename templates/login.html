{% extends "base.html" %}

{% block title %}Bejelentkezés - Tenisz Foglaló{% endblock %}

{% block content %}
     <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <h2 class="mb-4 text-center">Bejelentkezés</h2>
             <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email cím:</label>
                            <input type="email" class="form-control" id="email" name="email" required value="{{ request.form.email if request and request.form else '' }}">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Jelszó:</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Bejelentkezés</button>
                        </div>
                    </form>
                </div>
            </div>
            <p class="mt-3 text-center">Még nincs fiókod? <a href="{{ url_for('register') }}">Regisztrálj itt!</a></p>
        </div>
    </div>
{% endblock %}
